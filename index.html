<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXP Fusion Dynamics | Visual Performance Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Azeret+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

<div id="fv-fusion-app">
    <div class="training-arena" id="arena">
        <div class="hud" id="hud-display">
            STATUS: <strong id="status-text">IDLE</strong> | TIME: <strong id="timer-val" class="timer-display">00:00</strong><br>
            PRISM: <strong id="prism-val-hud">0.0 Δ</strong> | STEREO: <strong id="hud-stereo-val">0.00</strong>
            <span class="lab-tag" id="dynamic-mode-tag">AXP FUSION DYNAMICS 視覺空間優化矩陣</span>
        </div>
        
        <div id="webgl-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>
        <div class="breathe-reminder">💡 訓練中請保持平穩呼吸，勿憋氣</div>
    </div>

    <div class="control-panel" style="z-index: 20;">
        <div class="app-title">AXP FUSION</div>

        <div class="panel-section">
            <div class="section-title">🎨 視覺與形體</div>
            <div class="control-group">
                <select id="shape-select">
                    <optgroup label="經典平面對焦 (Classic)">
                        <option value="circle3">三層同心圓 ( 3-Rings )</option>
                        <option value="circle5">五層同心圓 ( 5-Rings )</option>
                        <option value="star3">三層扁平星芒 ( 3-Stars )</option>
                        <option value="star5">五層扁平星芒 ( 5-Stars )</option>
                    </optgroup>
                    <optgroup label="高階 3D 幾何 (WebGL 3D)">
                        <option value="sphere5" selected>3D 網格地球儀 ( 5-Sphere )</option>
                        <option value="glossysphere">高光實體晶球 ( Glossy Sphere )</option>
                        <option value="crystal8">3D 雙層八面晶體 ( 8-Crystal )</option>
                        <option value="torusKnot">3D 無盡紐結 ( Neuro-Knot )</option>
                        <option value="nested_dodeca">3D 嵌套量子核 ( Quantum Core )</option>
                    </optgroup>
                    <optgroup label="客製化">
                        <option value="text">高頻視標文字 ( TEXT )</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="control-group" id="text-input-group" style="display: none; margin-top: 4px;">
                <input type="text" id="custom-text" value="AXP" placeholder="輸入文字..." style="text-align: center; font-weight: bold; font-size: 16px; letter-spacing: 2px;">
            </div>

            <div class="control-group" style="margin-top: 8px;">
                <label>視覺感知尺寸 [ W / S ] <span class="val-display" id="size-label">200px</span></label>
                <input type="range" id="size-slider" min="100" max="600" step="0.1" value="200">
            </div>
            <div class="control-group">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>線條粗細 [ A / D ] <span class="val-display" id="thick-label">9.0</span></span>
                    <div style="display:flex; gap:8px;">
                        <label class="checkbox-wrapper"><input type="checkbox" id="rotate-checkbox" checked> 轉 [R]</label>
                        <label class="checkbox-wrapper"><input type="checkbox" id="fill-checkbox"> 滿 [F]</label>
                    </div>
                </label>
                <input type="range" id="thick-slider" min="1" max="10" step="0.1" value="9">
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">
                <span>🚀 空間動態 ( Y U I O P )</span>
                <label class="checkbox-wrapper" id="ai-toggle-wrapper" title="Z 鍵切換"><input type="checkbox" id="ai-toggle"> AI 託管 [ Z ]</label>
            </div>
            
            <div class="control-group" style="background: rgba(59, 130, 246, 0.15); padding: 10px; border-radius: 6px; border-left: 3px solid #3b82f6; margin-bottom: 8px;">
                <label style="color: #60a5fa; margin-bottom: 8px; display: flex; justify-content: space-between;">
                    <span>稜鏡需求量 [ 1 BI / 2 BO ]</span>
                    <span class="val-display" id="prism-label">0.0 Δ (平光)</span>
                </label>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 4px;">
                    <span>BI (-6)</span>
                    <span>0</span>
                    <span>BO (+40)</span>
                </div>
                <input type="range" id="prism-slider" min="-6" max="40" step="0.5" value="0">
            </div>

            <div class="control-group">
                <label>運動速度 [ , 慢 / . 快 ] <span class="val-display" id="speed-label">20</span></label>
                <input type="range" id="speed-slider" min="1" max="100" step="0.1" value="20">
            </div>
            
            <div class="control-group" style="margin-top: 4px;">
                <label>立體視深度 [ [ 凹陷 / ] 凸出 ] <span class="val-display" id="stereo-label">0.00</span></label>
                <input type="range" id="stereo-slider" min="-0.15" max="0.15" step="0.01" value="0">
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">🔬 數位光學與視覺感知微調</div>
            <div class="control-group">
                <select id="glasses-select">
                    <option value="rb" selected>紅藍眼鏡（Digital Anaglyph）</option>
                    <option value="rg">紅綠眼鏡（Classic Tranaglyph）</option>
                </select>
            </div>
            <div class="control-group">
                <label>視覺感知平衡 <span class="val-display" id="balance-label">50/50</span></label>
                <input type="range" id="balance-slider" min="0" max="100" value="50" style="background: linear-gradient(to right, #3b82f6, #ef4444);">
            </div>
            <div class="control-group">
                <label>疊影濾除校正 <span class="val-display"><span id="l-label-text">藍光</span>: <span id="l-val">100%</span> | 紅光: <span id="r-val">100%</span></span></label>
                <input type="range" id="blue-slider" min="5" max="100" value="100" style="accent-color: #0080ff; margin-bottom: 4px;">
                <input type="range" id="green-slider" min="5" max="100" value="100" style="accent-color: green; display: none; margin-bottom: 4px;">
                <input type="range" id="red-slider" min="5" max="100" value="100" style="accent-color: red;">
            </div>
            <div class="control-group">
                <div style="display: flex; gap: 8px;">
                    <select id="screen-spec" style="flex: 2;">
                        <option value="retina16">MacBook Pro (226 DPI)</option>
                        <option value="ipad13">iPad Pro (264 DPI)</option>
                        <option value="generic">一般螢幕 (96 DPI)</option>
                    </select>
                    <input type="number" id="view-dist" value="50" min="20" style="flex: 1; text-align: center;" title="觀距(cm)">
                </div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-toggle" id="start-btn">開始 [ Space ]</button>
            <button class="btn-reset" id="reset-btn" title="歸零 [ Enter ]">
                <svg viewBox="0 0 512 512" style="width:18px; fill:currentColor;"><path d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg>
            </button>
        </div>
        <button class="btn-fullscreen" id="fullscreen-btn">進入全螢幕沉浸模式</button>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
