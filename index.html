<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXP Fusion Dynamics | Visual Performance Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Azeret+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

<div id="fv-fusion-app">
    <div class="training-arena" id="arena">
        <div class="hud" id="hud-display">
            STATUS: <strong id="status-text">IDLE</strong> | TIME: <strong id="timer-val" class="timer-display">00:00</strong><br>
            SEP: <span id="sep-val">0.0px</span> | <strong id="prism-val">0.0 Δ</strong> | STEREO: <strong id="hud-stereo-val">0.00</strong>
            <span class="lab-tag" id="dynamic-mode-tag">AXP FUSION DYNAMICS 視覺空間優化矩陣</span>
        </div>
        
        <div id="webgl-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>
        
        <div class="breathe-reminder">💡 訓練中請保持平穩呼吸，勿憋氣</div>
    </div>

    <div class="control-panel" style="z-index: 20;">
        <div class="app-title">AXP FUSION DYNAMICS</div>

        <div class="panel-section">
            <div class="section-title">🎨 視覺與形體</div>
            <div class="control-group">
                <select id="shape-select">
                    <optgroup label="3D 實體晶體 (稜鏡)">
                        <option value="crystal1">單層稜鏡晶體 ( 1-Crystal )</option>
                        <option value="crystal3">三層稜鏡晶體 ( 3-Crystal )</option>
                        <option value="crystal5">五層稜鏡晶體 ( 5-Crystal )</option>
                    </optgroup>
                    <optgroup label="3D 幾何隧道">
                        <option value="circle3">三層同心圓環 ( 3-Rings )</option>
                        <option value="circle5">五層同心隧道 ( 5-Rings )</option>
                        <option value="star3">三層星形漏斗 ( 3-Stars )</option>
                        <option value="star5" selected>五層星形隧道 ( 5-Stars )</option>
                    </optgroup>
                    <optgroup label="3D 客製化">
                        <option value="text">客製化文字 ( TEXT )</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="control-group" id="text-input-group" style="display: none; margin-top: 4px;">
                <input type="text" id="custom-text" value="Dodge" placeholder="輸入文字..." style="text-align: center; font-weight: bold; font-size: 16px; letter-spacing: 2px;">
            </div>

            <div class="control-group" style="margin-top: 8px;">
                <label>視覺感知尺寸 [ W / S ] <span class="val-display" id="size-label">200px</span></label>
                <input type="range" id="size-slider" min="100" max="600" step="0.1" value="200">
            </div>
            <div class="control-group">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>3D 實體厚度 [ D / A ] <span class="val-display" id="thick-label">9.0</span></span>
                    <div style="display:flex; gap:8px;">
                        <label class="checkbox-wrapper"><input type="checkbox" id="rotate-checkbox" checked> 轉 [R]</label>
                        <label class="checkbox-wrapper"><input type="checkbox" id="fill-checkbox"> 滿 [F]</label>
                    </div>
                </label>
                <input type="range" id="thick-slider" min="2" max="25" step="0.1" value="9">
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">
                <span>🚀 AI 託管矩陣 ( Y U I O P )</span>
                <label class="checkbox-wrapper" id="ai-toggle-wrapper" title="Z 鍵切換"><input type="checkbox" id="ai-toggle"> AI 模式 [ Z ]</label>
            </div>
            <div class="control-group">
                <label>最大分離距離 [ 2遠 / 1近 ] <span class="val-display" id="dist-label">120px</span></label>
                <input type="range" id="dist-slider" min="0" max="600" step="0.1" value="120">
            </div>
            <div class="control-group">
                <label>運動速度 [ ← / → / Shift ] <span class="val-display" id="speed-label">20</span></label>
                <input type="range" id="speed-slider" min="1" max="100" step="0.1" value="20">
            </div>
            <div class="control-group">
                <div style="display: flex; gap: 8px;">
                    <select id="axis-select" style="flex: 1;">
                        <option value="horizontal">↔ 水平模式</option>
                        <option value="vertical">↕ 垂直模式</option>
                        <option value="circular">🔄 環形模式</option>
                        <option value="roam">🌌 全域漫遊</option>
                        <option value="saccade">⚡ 隨機跳視</option>
                    </select>
                    <select id="mode-select" style="flex: 1;">
                        <option value="crossover">交錯 (Cross)</option>
                        <option value="oneway_bo">內聚 (BO)</option>
                        <option value="oneway_bi">開散 (BI)</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label>立體視深度 [ ↑凸出 / ↓凹陷 ] <span class="val-display" id="stereo-label">0.00</span></label>
                <input type="range" id="stereo-slider" min="-0.5" max="0.5" step="0.01" value="0">
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">🔬 數位光學與視覺平衡</div>
            <div class="control-group">
                <select id="glasses-select">
                    <option value="rc" selected>🔴🔵 紅 / 青 (藍) 專業標配</option>
                    <option value="rg">🔴🟢 紅 / 綠 測試模式</option>
                </select>
            </div>
            <div class="control-group">
                <label>視覺感知平衡 <span class="val-display" id="balance-label">50/50</span></label>
                <input type="range" id="balance-slider" min="0" max="100" value="50" style="background: linear-gradient(to right, red, green);">
            </div>
            <div class="control-group">
                <label>鬼影濾除校正 <span class="val-display">R: <span id="r-val">100%</span> | G: <span id="g-val">100%</span><span id="b-val-box"> | B: <span id="b-val">100%</span></span></span></label>
                <input type="range" id="red-slider" min="5" max="100" value="100" style="accent-color: red;">
                <input type="range" id="green-slider" min="5" max="100" value="100" style="accent-color: green;">
                <div id="blue-channel-box" style="display: block;">
                    <input type="range" id="blue-slider" min="5" max="100" value="100" style="accent-color: #0080ff;">
                </div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-toggle" id="start-btn">開始 [ Space ]</button>
            <button class="btn-reset" id="reset-btn" title="歸零 [ Enter ]">
                <svg viewBox="0 0 512 512" style="width:18px; fill:currentColor;"><path d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg>
            </button>
        </div>
        <button class="btn-fullscreen" id="fullscreen-btn">進入全螢幕沉浸訓練模式</button>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
